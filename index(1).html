// PeerJS 기반 온라인 방: 방장은 방 ID를 열고, 친구는 그 ID로 직접 연결합니다.
function makePeerRoom(peer,isHost,roomId,hostConn){
  const handlers={},connections=new Map(),presence={};let peerListChanged=()=>{};
  const selfId=peer.id;
  function attach(conn){
    const entry={conn,presence:{}};connections.set(conn.peer,entry);
    conn.on('data',msg=>{
      if(!msg||typeof msg!=='object')return;
      if(msg.type==='presence'){entry.presence=Object.assign(entry.presence,msg.data||{});peerListChanged()}
      else if(msg.type==='event'&&!isHost){(handlers[msg.name]||[]).forEach(fn=>fn({data:msg.data}))}
    });
    conn.on('close',()=>{connections.delete(conn.peer);delete presence[conn.peer];peerListChanged()});
    conn.on('error',()=>{connections.delete(conn.peer);peerListChanged()});
    if(conn.open)peerListChanged();else conn.on('open',peerListChanged);
  }
  if(isHost)peer.on('connection',attach);else attach(hostConn);

    peers(){
      const mine={peer:selfId,isMe:true,sameTab:true,presence:{}};
      if(isHost)return [mine,...Array.from(connections,([id,e])=>({peer:id,isMe:false,presence:e.presence||{}})).filter(x=>connections.get(x.peer)?.conn.open)];
      return [mine,{peer:roomId,isMe:false,presence:{}}];
    },
    presence(data){if(isHost)return Promise.resolve();try{hostConn.send({type:'presence',data});return Promise.resolve()}catch(e){return Promise.reject(e)}},
    emit(name,data){if(!isHost)return Promise.resolve();for(const e of connections.values()){if(e.conn.open)try{e.conn.send({type:'event',name,data})}catch(x){}}return Promise.resolve()},
    on(name,fn){(handlers[name]||(handlers[name]=[])).push(fn)},
    onPeers(fn){peerListChanged=fn;fn()},
    close(){try{peer.destroy()}catch(e){}}
  };
}
